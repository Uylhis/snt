<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Version carrée (icône d'onglet, vignette) : S, N, T sur le gris de la charte -->
  <!-- Fond : gris de la charte, bords arrondis -->
  <rect width="200" height="200" rx="24" fill="#6d6e71"/>

  <!-- S : gris sur blanc (comme le grand S du logo principal) -->
  <rect x="14" y="44" width="54" height="112" rx="8" fill="#ffffff"/>
  <text x="41" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold" fill="#6d6e71">S</text>

  <!-- N : blanc sur rouge -->
  <rect x="73" y="44" width="54" height="112" rx="8" fill="#a3262a"/>
  <text x="100" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold" fill="#ffffff">N</text>

  <!-- T : blanc sur doré -->
  <rect x="132" y="44" width="54" height="112" rx="8" fill="#e3a335"/>
  <text x="159" y="122" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="bold" fill="#ffffff">T</text>
</svg>
